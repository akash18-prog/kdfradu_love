<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Only for Kutty Ma ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle,#1b1b2f,#000);
  color:#fff;
  text-align:center;
}

.hidden{display:none;}

.section{padding:50px 20px;}

h1,h2{font-family:'Great Vibes',cursive;}
h1{font-size:3rem;}
h2{font-size:2.3rem;}

p{max-width:700px;margin:auto;line-height:1.8;font-size:1.05rem;}

/* PASSWORD */
#lock{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
input{
  padding:12px;
  border-radius:20px;
  border:none;
  font-size:1rem;
  text-align:center;
}
button{
  margin-top:15px;
  padding:12px 30px;
  border-radius:30px;
  border:none;
  background:#ff4b5c;
  color:white;
  font-size:1rem;
}

/* TYPING */
#typing{border-right:2px solid white;padding-right:5px;}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;
  margin-top:30px;
}
.gallery img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 0 15px rgba(255,105,180,0.4);
}

/* RING */
.ring{
  font-size:3rem;
  animation:ring 1.5s infinite;
}
@keyframes ring{
  0%{transform:scale(1);}
  50%{transform:scale(1.2) rotate(10deg);}
  100%{transform:scale(1);}
}

footer{opacity:.7;font-size:.8rem;margin:40px 0 20px;}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="lock">
  <h2>Only for Kutty Ma ❤️</h2>
  <input type="password" id="pass" placeholder="Enter password">
  <button onclick="unlock()">Open 💖</button>
</div>

<!-- MAIN CONTENT -->
<div id="content" class="hidden">

<audio autoplay loop>
  <source src="enneelothi.mp3" type="audio/mpeg">
</audio>

<div class="section">
  <h1>Kutty Ma ❤️</h1>
  <p id="typing"></p>
</div>

<div class="section">
  <h2>Our Memories</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<div class="section">
  <h2>Countdown to Valentine 💕</h2>
  <p id="countdown"></p>
</div>

<div class="section">
  <h2>My Question</h2>
  <div class="ring">💍</div>
  <p>Will you be my Valentine and my forever?</p>
</div>

<footer>Forever yours — Fradu ❤️</footer>

</div>

<script>
function unlock(){
  if(document.getElementById("pass").value==="kuttyma"){
    document.getElementById("lock").style.display="none";
    document.getElementById("content").classList.remove("hidden");
  }else{
    alert("Wrong password ❤️");
  }
}

/* Typing text */
const text="October 13 you entered my life. October 20 my Kutty Ma was born. December 20 I became your father forever.";
let i=0;
setInterval(()=>{
  if(i<text.length){
    document.getElementById("typing").innerHTML+=text.charAt(i);
    i++;
  }
},70);

/* Countdown */
const valentine=new Date(new Date().getFullYear(),1,14);
setInterval(()=>{
  const now=new Date();
  const diff=valentine-now;
  const days=Math.floor(diff/(1000*60*60*24));
  document.getElementById("countdown").innerText=days+" days left";
},1000);
</script>

</body>
</html>
